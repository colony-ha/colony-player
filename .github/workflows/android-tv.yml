name: Build COLONY PLAYER Android TV

on:
  push:
    branches: [android-tv]
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-tv/**"
      - "functions/api/device/register.js"
      - "functions/api/playlists/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download official COLONY PLAYER logo
        run: |
          mkdir -p android-tv/app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/colony-ha/colony-player/main/Colony%20Player%20Gold%20Emblem.png" \
            --output android-tv/app/src/main/res/drawable-nodpi/colony_player_logo.png
          test -s android-tv/app/src/main/res/drawable-nodpi/colony_player_logo.png
      - name: Download approved COLONY PLAYER home screen artwork
        run: |
          mkdir -p android-tv/app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/colony-ha/colony-player/main/Colony%20Player%20Black-Gold%20IPTV%20Interface.png" \
            --output android-tv/app/src/main/res/drawable-nodpi/colony_home_screen.png
          test -s android-tv/app/src/main/res/drawable-nodpi/colony_home_screen.png
      - name: Download approved COLONY PLAYER activation artwork
        run: |
          mkdir -p android-tv/app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/colony-ha/colony-player/main/Premium%20Gold%20Media%20App%20Activation%20Screen.png" \
            --output android-tv/app/src/main/res/drawable-nodpi/colony_activation_screen.png
          test -s android-tv/app/src/main/res/drawable-nodpi/colony_activation_screen.png
      - name: Build debug APK
        working-directory: android-tv
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: COLONY-PLAYER-AndroidTV-debug
          path: android-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare private Play upload key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.COLONY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android-tv/upload-keystore.jks
          fi
      - name: Build release APK and AAB
        working-directory: android-tv
        env:
          COLONY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.COLONY_UPLOAD_KEYSTORE_PASSWORD }}
          COLONY_UPLOAD_KEY_ALIAS: ${{ secrets.COLONY_UPLOAD_KEY_ALIAS }}
          COLONY_UPLOAD_KEY_PASSWORD: ${{ secrets.COLONY_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: COLONY-PLAYER-AndroidTV-build
          path: |
            android-tv/app/build/outputs/apk/debug/*.apk
            android-tv/app/build/outputs/apk/release/*.apk
            android-tv/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
