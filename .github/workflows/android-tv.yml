name: Build COLONY PLAYER Android TV

on:
  pull_request:
    branches: [main]
    paths:
      - "android-tv/**"
      - "functions/api/device/register.js"
      - "functions/api/playlists/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-tv
        run: gradle --no-daemon assembleDebug
      - name: Build release APK and AAB (unsigned)
        working-directory: android-tv
        run: gradle --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: COLONY-PLAYER-AndroidTV-build
          path: |
            android-tv/app/build/outputs/apk/debug/*.apk
            android-tv/app/build/outputs/apk/release/*.apk
            android-tv/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
