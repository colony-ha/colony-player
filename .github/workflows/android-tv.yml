name: Build COLONY PLAYER Android TV

on:
  push:
    branches: [android-tv]
    paths:
      - "android-tv/**"
      - "functions/api/device/register.js"
      - "functions/api/playlists/**"
  pull_request:
    branches: [main]
    paths:
      - "android-tv/**"
      - "functions/api/device/register.js"
      - "functions/api/playlists/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-tv
        run: gradle --no-daemon assembleDebug

      - name: Build release APK and AAB (unsigned)
        working-directory: android-tv
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Upload installable APKs and Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: COLONY-PLAYER-AndroidTV-build
          path: |
            android-tv/app/build/outputs/apk/debug/*.apk
            android-tv/app/build/outputs/apk/release/*.apk
            android-tv/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
